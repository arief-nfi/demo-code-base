version: '3.8'
services:
  postgres:
    restart: always
    ports: !reset []

  api:
    restart: always
    ports: !reset []
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    restart: always
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 256M
